version: '3.8'

services:
  # PostgreSQL database for multi-tenant architecture
  postgres:
    image: postgres:15-alpine
    container_name: sky-nether-postgres
    environment:
      POSTGRES_USER: sky_nether
      POSTGRES_PASSWORD: sky_nether_password
      POSTGRES_DB: sky_nether_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky_nether"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: sky-nether-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: sky-nether-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skynether.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: